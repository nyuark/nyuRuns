
; System Configuration file
; This contains the core configuration

; Environment platform (TEST, PREV, PROD) 
ENV_NAME = DEV

; TEST AND PREV ENVS ONLY
; Logging mode, FULL (Verbose), BASE (Basic), MINI (Minimal logging) 
LOG_MODE = FULL
; The path where log files are stored (usually error.log, runner.log, access.log, app_name.log) 
LOG_PATH = /temp/logs
; The maximum size in KB of a log file before rotation or before line removal, 0=unlimited
LOG_SIZE = 1024
; The log rotation mode (NUMBER, WEEKLY, MONTHS, UNIQUE) 
LOG_ROTA = NUMBER
; The log rotation mode (NUMBER, WEEKLY, MONTHS, UNIQUE) 
LOG_PREF = Y-m-d H:i 

; TEST ENV ONLY
; Error raising level (using PHP constants)
ERR_LEVL = E_ALL
; Show errors (TRUE/FALSE)
ERR_SHOW = TRUE

; REVERSE PROXY
; Addresses or CIDR ranges of the reverse proxies standing in front of this server (load balancer, CDN,
; TLS front), separated by commas: "10.0.0.5, 192.168.0.0/24, fd00::/8". Empty when clients connect directly.
; Only a request coming from one of them has its forwarding header read to find the client address.
PRX_LIST = ""
; Name of the header in which those proxies give the client address
PRX_HEAD = X-Forwarded-For

; SOUNDS
; Full path of the ffmpeg program that unpacks sounds, empty when the server has none
SND_TOOL = env:NYU_SND_TOOL
; Seconds a run of that program may take
SND_TIME = 60