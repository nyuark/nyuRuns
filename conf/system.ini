
; System Configuration file
; This contains the core configuration

; Environment platform (DEV, TEST, PREV, PROD) 
ENV_NAME = DEV

; LOGGING (written in every environment)
; Logging mode: FULL (every level, with context), BASE (no debug, no context), MINI (errors, warnings and notices: date and message only) 
LOG_MODE = FULL
; The folder where log files are stored, from the project root (error.log, access.log, runner.log, and one per application: app_name.log) 
LOG_PATH = /temp/logs
; The maximum size in KB of a log file before it is rotated, 0=unlimited (NUMBER rotation only)
LOG_SIZE = 1024
; The log rotation mode: NUMBER (numbered backups past LOG_SIZE), WEEKLY or MONTHS (dated file names), UNIQUE (one file per process) 
LOG_ROTA = NUMBER
; The date() format of the time written at the start of each log line
LOG_PREF = Y-m-d H:i 

; ERRORS (shown in DEV, TEST and PREV when ERR_SHOW is TRUE; never in PROD)
; The errors PHP reports: E_* names joined by |, & and ~ ("E_ALL & ~E_DEPRECATED", between quotes); E_ALL when empty. What it leaves out is neither shown nor logged
ERR_LEVL = E_ALL
; Show errors (TRUE/FALSE); never shown when ENV_NAME is PROD
ERR_SHOW = TRUE

; CACHE
; Cache the config (TRUE/FALSE): a request reads the presets, the config files and the routes once, the next ones
; read them from temp/cache. Removed by "settings setValue" and any change made by a command; after editing conf by
; hand, CNF_CACH included, run "php nyuRun settings clrCache". Set to TRUE in the stage and final bundles.
CNF_CACH = FALSE
; Keep the descriptions of the tables in that cache too (TRUE/FALSE, with CNF_CACH): no EXPLAIN on each request.
; A table changed outside nyuRuns (a migration, an ALTER TABLE) needs "php nyuRun settings clrCache"; a query failing
; on a table described from the cache removes it by itself.
TBL_CACH = FALSE

; LISTS
; Rows a list reads when the count it is asked for is not a number
LST_ROWS = 100

; LANGUAGES
; Language of the mails of a user who has none: a tag in lower case (en, fr, fr-ch); en when empty
LNG_DFLT = en

; REQUESTS
; Largest body of a request, in KB, 0=unlimited; a larger one is answered 413
REQ_SIZE = 8192
; Most parts a multipart body may hold, 0=unlimited; more are answered 413
REQ_PART = 200

; SOUNDS
; Full path of the ffmpeg program that unpacks sounds, empty when the server has none
SND_TOOL = env:NYU_SND_TOOL
; Seconds a run of that program may take
SND_TIME = 60

; REVERSE PROXY
; Addresses or CIDR ranges of the reverse proxies standing in front of this server (load balancer, CDN,
; TLS front), separated by commas: "10.0.0.5, 192.168.0.0/24, fd00::/8". Empty when clients connect directly.
; Only a request coming from one of them has its forwarding header read to find the client address.
PRX_LIST = ""
; Name of the header in which those proxies give the client address
PRX_HEAD = X-Forwarded-For
; Name of the header in which those proxies give the scheme the client used (http or https)
PRX_SCHM = X-Forwarded-Proto